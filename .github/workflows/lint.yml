name: 'Lint collection-index.yml'
on:
  pull_request:
    paths:
      - _data/collection-index.yml
      - .github/scripts/check-collection-index.sh
      - .github/workflows/lint.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  yamllint:
    name: 'Yamllint'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Yamllint'
        uses: karancode/yamllint-github-action@v2.1.1
        with:
          yamllint_file_or_dir: _data/collection-index.yml
          yamllint_strict: true
          yamllint_config_filepath: .github/lint-config.yaml
          yamllint_comment: true
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  entries:
    name: 'Check added and changed entries'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Check entries'
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          bash .github/scripts/check-collection-index.sh FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
